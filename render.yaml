services:
  # Backend API Service
  - type: web
    name: evelinas-flowershop-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://evelinas-flowershop.onrender.com

  # Frontend Static Site
  - type: web
    name: evelinas-flowershop
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://evelinas-flowershop-api.onrender.com/api