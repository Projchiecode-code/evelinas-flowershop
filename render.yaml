services:
  # Backend API Service
  - type: web
    name: evelinas-flowershop-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://evelinas-flowershop.onrender.com
      # Optional: enables the AI gift-message writer (POST /api/ai/gift-message).
      # Create a free key at https://aistudio.google.com/apikey, then set its
      # value in the Render dashboard (Service → Environment). Without it the
      # storefront simply hides the AI writer button.
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site
  - type: web
    name: evelinas-flowershop
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://evelinas-flowershop-api.onrender.com/api